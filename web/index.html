<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An AI strength coach that programs, adjusts, and progresses powerlifters over time." />
    <title>Coach Diaz - AI Powerlifting Programming</title>

    <!--
      ── INSTALLABLE, NOT AN APP STORE APP ────────────────────────────────

      A manifest gets "Add to Home Screen" on both iOS and Android: own icon,
      own launcher entry, no browser chrome. No store listing, no review, no
      commission, and it ships through the same deploy as everything else -
      which is the whole reason to do this before writing a native app for a
      product with three users.

      There is deliberately NO service worker. One would make the app work
      offline and would also introduce a second cache with its own lifetime,
      capable of serving a build older than the one the version banner is
      comparing against. That is a caching bug on top of a deploy problem we
      have just finished solving, in exchange for offline access to a coach
      that requires the network to answer.
    -->
    <!--
      ── WHAT A SHARED LINK LOOKS LIKE ────────────────────────────────────

      Now that / is a page worth sending somebody rather than a sign-in form,
      the link gets pasted into messages, and every messaging app renders a
      preview from these four tags. Without them it renders the bare URL, which
      reads as something dubious.

      This used to point at the 512x512 app icon under a comment saying a wide
      image was worth making and not worth faking with a square one. It is made
      now: `scripts/make-social-card.mjs` renders one at 1200x630 from the
      palette in styles.css, the headline in the English locale and the mark in
      Logo.jsx, so the card cannot drift from the product or claim something
      the site does not say.

      1200x630 is Meta's recommended size and the 1.91:1 they ask for to
      "display the full image in Feed without any cropping". 512 was under
      their 600x315 working minimum on the long edge, and their guidance is
      explicit about what that costs: an image below it "will still display in
      the link page post, but the size will be much smaller" - a thumbnail
      beside the text rather than a card.

      og:image:alt because the Open Graph specification says that "if the page
      specifies an og:image it should specify og:image:alt", and because a
      preview card is content somebody may be hearing rather than seeing. The
      width and height are declared so a crawler can lay the card out before
      the image has finished downloading.

      X's own card documentation now redirects to a generic developer overview,
      so summary_large_image is set on the strength of Meta's numbers and the
      shared 1.91:1 convention rather than on a figure quoted from a page that
      no longer exists.

      These are static, so they do not change per route - correct for an SPA
      with no server rendering, since a crawler that does not run JavaScript
      sees this file whatever path it asked for. The description matches the
      manifest and the meta description above it deliberately.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coach Diaz" />
    <meta property="og:title" content="Coach Diaz - AI Powerlifting Programming" />
    <meta
      property="og:description"
      content="An AI strength coach that programs, adjusts, and progresses powerlifters over time."
    />
    <meta property="og:url" content="https://coachdiaz.app/" />
    <meta property="og:image" content="https://coachdiaz.app/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Coach Diaz. A strength coach that reads what you actually lifted."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="Coach Diaz. A strength coach that reads what you actually lifted."
    />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Matches the palette in styles.css so the status bar does not flash a
         colour the app never uses. Two values because the app themes itself
         from prefers-color-scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0d1a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f3f8" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" />

    <!-- iOS reads none of the manifest's icons. It wants this one, it does not
         composite a background behind it, and it applies its own corner
         radius - so apple-touch-icon.png carries its own background and sits
         inside that radius rather than being clipped by it. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Coach Diaz" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
