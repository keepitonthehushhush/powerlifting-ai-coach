name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test, build, and scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
        env:
          # Placeholder values: these tests exercise pure logic and never open a
          # socket. Real credentials are deliberately absent from CI.
          ANTHROPIC_API_KEY: test-key-not-real
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

      # The deploy gate. A secret in the browser bundle is readable by every
      # visitor, so this failing must block the merge.
      - name: Scan built bundle for server-side secrets
        run: npm run verify:bundle
