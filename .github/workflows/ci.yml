name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test, build, and scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      # Pinned to the majors that declare `using: node24`. Node 20 is removed
      # from GitHub runners entirely on 23 September 2026, so this is a
      # deadline rather than a warning - after that date a node20 action does
      # not run at all.
      #
      # Checked rather than assumed, and it mattered: checkout and setup-node
      # reach node24 at v5, but upload-artifact@v5 still declares node20 and
      # only v6 moves. Bumping all three to v5 would have looked complete and
      # left one of them broken.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Before installing, not after. `npm ci` refuses to run when
      # package.json and package-lock.json disagree, and its message arrives
      # buried in an install log. This says which package and what to do about
      # it, and it is runnable locally - which is the point, because a
      # dependency added on a machine with no registry access is exactly how
      # the two drift apart.
      - name: Lockfile matches the manifests
        run: npm run check:lockfile

      # `npm ci` requires a committed package-lock.json and installs exactly
      # what it pins. `npm install` would silently resolve newer versions, so
      # CI would be testing something other than what ships.
      - name: Install dependencies
        run: npm ci

      # First, because it is the fastest check in the file and it catches the
      # cheapest class of mistake. Two production outages in one week were both
      # default ESLint rules - `no-undef` for a variable that does not exist at
      # module scope, `no-dupe-keys` for the same key declared twice - and both
      # got through a green build, a green suite and a green deploy.
      - name: Lint
        run: npm run lint

      # Deliberately no `env:` block. The suite runs with an empty environment,
      # which is the assertion: nothing under test should need a credential to
      # be constructed. Injecting placeholder secrets here would hide exactly
      # the coupling that made two test files fail on a clean machine.
      - name: Unit tests
        run: npm test

      # Checks the dependency manifest, not the output. A server-only package
      # declared in web/package.json is a bundling accident waiting to happen
      # even while nothing imports it, so the bundle scanner cannot see it.
      - name: Verify no server-only packages in the frontend manifest
        run: npm run verify:deps

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

      # Every other check in this file reads a file. Two blank pages have now
      # shipped past all of them, both because a module threw while it was
      # being IMPORTED - which is invisible to anything that does not run the
      # code in a browser. This is a visitor: it serves web/dist, loads it in
      # headless Chrome with the network cut off, and fails if nothing renders.
      #
      # Chrome and Chromium are both preinstalled on the ubuntu runner image,
      # so this needs no setup step and no browser download.
      - name: The built app mounts in a browser
        run: npm run check:mounts

      # The deploy gate. A secret in the browser bundle is readable by every
      # visitor, so this failing must block the merge.
      - name: Scan built bundle for server-side secrets
        run: npm run verify:bundle

      # A wrong path in a document is not a syntax error, so nothing else will
      # ever catch it. `server/.env` was referenced for days in a message whose
      # whole job was telling somebody where to look.
      - name: Check the documentation describes a repository that exists
        run: npm run check:docs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
